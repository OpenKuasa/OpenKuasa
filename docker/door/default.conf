# OpenKuasa's front door for docker-compose.hosted-single-port.yml: one port
# (58273) in front of the app, for a host that gives one link for one port.
#
# The app is asked for uncompressed responses: BoxCompute's preview link
# delivers a gzip-compressed static file with an empty body (2026-11-04), and
# its own edge compresses for the browser. Responses are not buffered, so chat
# replies stream as they are written.
server {
  listen 8080;
  # Chat attachments go up to 12 MB.
  client_max_body_size 16m;

  # Docker's own DNS, re-read so a recreated app container is found again.
  resolver 127.0.0.11 valid=10s;
  set $app http://app:3000;

  location / {
    proxy_pass $app;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_read_timeout 300s;
  }
}
